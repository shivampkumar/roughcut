[project]
name = "montage"
version = "0.1.0"
description = "Camera roll to viral reel — drop photos + videos, get one finished short."
requires-python = ">=3.11"
dependencies = [
  "google-genai>=0.3.0",
  "anthropic>=0.40.0",
  "elevenlabs>=1.10.0",
  "librosa>=0.10.2",
  "opencv-python-headless>=4.10.0",
  "pillow>=10.4.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "typer>=0.12.5",
  "exifread>=3.0.0",
  "numpy>=1.26.4",
  "tqdm>=4.66.5",
  "httpx>=0.27.2",
  "ffmpeg-python>=0.2.0",
  "mediapipe>=0.10.18",
  "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "soundfile>=0.12.1",
]

[project.scripts]
montage = "montage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["montage"]
